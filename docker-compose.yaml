services:
  agenthub-observability:
    build: .
    container_name: agenthub-observability
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq.internal
      RABBITMQ_PORT: 5672
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.observability.internal

networks:
  agenthub-shared-net:
    external: true
    name: agenthub-shared-net
