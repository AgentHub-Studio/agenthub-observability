---
# agenthub-observability — Go (replaces Java Spring WebFlux version)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-observability
  namespace: agenthub
  labels:
    app: agenthub-observability
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-observability
  template:
    metadata:
      labels:
        app: agenthub-observability
        version: go
    spec:
      containers:
        - name: observability
          image: registry.cezar.dev/agenthub-observability:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agenthub-observability-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: RABBITMQ_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: CLICKHOUSE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-observability
  namespace: agenthub
  labels:
    app: agenthub-observability
spec:
  selector:
    app: agenthub-observability
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      protocol: TCP
