# Application
spring.application.name=agenthub-observability
server.port=8083

# Logging
logging.level.root=INFO
logging.level.dev.cezar.agenthub.observability=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ClickHouse R2DBC (reactive — trace/metric storage)
spring.r2dbc.url=r2dbc:clickhouse://clickhouse.internal:8123/agenthub
spring.r2dbc.username=default
spring.r2dbc.password=

# ClickHouse JDBC datasource (Flyway requires synchronous JDBC)
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
spring.datasource.url=jdbc:clickhouse://clickhouse.internal:8123/agenthub
spring.datasource.username=default
spring.datasource.password=

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholder-replacement=false
spring.flyway.locations=classpath:db/migrations

# Actuator (Health checks + Metrics)
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Observability Settings
agenthub.observability.trace-retention-days=30
agenthub.observability.metric-aggregation-interval=60
agenthub.observability.batch-size=100

# RabbitMQ Configuration (Event Streaming from Orchestrator)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:agenthub}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:agenthub_dev}

# RabbitMQ Listener Configuration
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Observability RabbitMQ Settings
agenthub.observability.rabbitmq.enabled=${AGENTHUB_OBSERVABILITY_RABBITMQ_ENABLED:false}
agenthub.observability.rabbitmq.exchange=agenthub.orchestrator.events
agenthub.observability.rabbitmq.queue=agenthub.observability.events
