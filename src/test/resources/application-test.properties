# Test Configuration for AgentHub Observability Service

# Use H2 in-memory database for tests
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

# Disable scheduling for unit tests
spring.task.scheduling.enabled=false

# Logging
logging.level.dev.cezar.agenthub.observability=DEBUG
logging.level.org.springframework.r2dbc=DEBUG

# Retention policies (short for tests)
observability.retention.traces-days=1
observability.retention.metric-events-days=1
observability.retention.aggregated-metrics-days=7
